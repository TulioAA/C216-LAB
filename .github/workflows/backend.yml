name: Backend Tests

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install

      - name: Run Tests
        run: pytest -v